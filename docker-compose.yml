services:
  api:
    image: node:26-alpine
    working_dir: /app
    volumes:
      - ./:/app
    command: sh -c "npm install --no-save json-server && npx json-server --watch db.json --host 0.0.0.0 --port 3001"
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
